@if (productsState$ | async; as state) {
<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Products</h1>

  @if (state.error) {
  <p class="text-red-500">{{ state.error }}</p>
  }

  <app-data-table
    [data]="state.products"
    [columns]="columns"
    [loading]="state.loading"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
  />
</div>
}
